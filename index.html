function loadImage(name, src) {
  const img = new Image();
  img.onload = () => { imagesLoaded++; if (imagesLoaded === totalImages) init(); };
  img.onerror = () => { imagesLoaded++; if (imagesLoaded === totalImages) init(); };
  img.src = src;
  images[name] = img;
}

class Particle {
  constructor(x, y, color, life = 0.6, size = 4) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 160;
    this.vy = (Math.random() - 0.5) * 160;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
  }
  update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; }
  draw() {
    const a = Math.max(0, this.life / this.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Bullet {
  constructor(x, y, tx, ty, speed, damage, color, fromEnemy, size) {
    this.x = x; this.y = y;
    const dx = tx - x, dy = ty - y;
    const len = Math.hypot(dx, dy) || 1;
    this.vx = (dx / len) * speed;
    this.vy = (dy / len) * speed;
    this.damage = damage;
    this.color = color;
    this.fromEnemy = fromEnemy;
    this.alive = true;
    this.size = size || (fromEnemy ? 6 : 4);
    this.life = 2.5;
  }
  update(dt, enemies) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0 || this.x < -40 || this.x > WIDTH + 40) { this.alive = false; return; }
    if (this.fromEnemy) {
      if (Math.abs(this.x - fortress.x) < 50 && Math.abs(this.y - (fortress.y - 80)) < 120) {
        fortress.takeDamage(this.damage);
        this.alive = false;
        particles.push(new Particle(this.x, this.y, '#ff6622', 0.3, 5));
      }
    } else {
      for (const e of enemies) {
        if (!e.alive) continue;
        const ey = e.y - (e.type === 'Flying' ? 60 : 30);
        if (Math.hypot(this.x - e.x, this.y - ey) < 22) {
          e.takeDamage(this.damage);
          this.alive = false;
          particles.push(new Particle(this.x, this.y, this.color, 0.25, 4));
          break;
        }
      }
    }
  }
  draw() {
    ctx.save();
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(this.x - this.vx * 0.015, this.y - this.vy * 0.015, this.size * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Weapon {
  constructor(type, level = 1) {
    this.type = type; this.level = level;
    this.damage = this.baseDamage();
    this.fireRate = this.baseFireRate();
    this.range = this.baseRange();
    this.critChance = 0.05 + level * 0.01;
    this.cooldown = 0;
  }
  baseDamage() {
    const b = { 'Machine Gun': 8, 'Laser Gun': 15, 'Plasma Gun': 25, 'Railgun': 120, 'Freeze Cannon': 6, 'Air Gun': 12 };
    return (b[this.type] || 10) * (1 + (this.level - 1) * 0.15);
  }
  baseFireRate() {
    const r = { 'Machine Gun': 8, 'Laser Gun': 4, 'Plasma Gun': 2, 'Railgun': 0.35, 'Freeze Cannon': 1.2, 'Air Gun': 5 };
    return (r[this.type] || 2) * (1 + (this.level - 1) * 0.08);
  }
  baseRange() {
    const r = { 'Machine Gun': 420, 'Laser Gun': 500, 'Plasma Gun': 480, 'Railgun': 700, 'Freeze Cannon': 380, 'Air Gun': 450 };
    return (r[this.type] || 400) + this.level * 12;
  }
  update(dt) { if (this.cooldown > 0) this.cooldown -= dt; }
  canFire() { return this.cooldown <= 0; }
  fire() {
    if (!this.canFire()) return null;
    this.cooldown = 1 / this.fireRate;
    const crit = Math.random() < this.critChance;
    return { damage: this.damage * (crit ? 2 : 1), crit };
  }
}

const WEAPON_SHOP = [
  { type: 'Machine Gun', cost: 120, desc: 'Fast fire' },
  { type: 'Laser Gun', cost: 200, desc: 'Precise beams' },
  { type: 'Plasma Gun', cost: 320, desc: 'Heavy energy' },
  { type: 'Railgun', cost: 500, desc: 'Long range anti-tank' },
  { type: 'Freeze Cannon', cost: 380, desc: 'Slows enemies' },
  { type: 'Air Gun', cost: 240, desc: 'Anti-air' }
];

const BLOCK_W = 150;
const BLOCK_H = 62;
const MAX_BLOCKS = 8;
const BLOCK_UNLOCKS = [1, 1, 4, 8, 12, 18, 25, 35];

class Fortress {
  constructor() {
    this.x = WIDTH - 180;
    this.y = GROUND_Y;
    this.health = 1000; this.maxHealth = 1000;
    this.shield = 500; this.maxShield = 500;
    this.shieldRegen = 5; this.coinMult = 1;
    this.sections = 0;
    this.weapons = [];
    this.sectionHealth = [];
    this.sectionMaxHealth = [];
    this.sectionShield = [];
    this.sectionMaxShield = [];
    this.bob = 0;
  }
  blockPos(i) {
    return { x: -78, y: -28 - i * 58 };
  }
  updateSections(level) { /* sections are only added by purchase */ }
  buyWeapon(type, slot) {
    const item = WEAPON_SHOP.find(w => w.type === type);
    if (!item || economy.coins < item.cost || slot >= this.sections) return false;
    economy.coins -= item.cost;
    this.weapons[slot] = new Weapon(type);
    return true;
  }
  sectionCost() { return 100 + this.sections * 50; }
  buySection() {
    if (this.sections >= MAX_BLOCKS || economy.coins < this.sectionCost()) return false;
    economy.coins -= this.sectionCost();
    this.sections++;
    this.weapons.push(null);
    this.sectionMaxHealth.push(250);
    this.sectionHealth.push(250);
    this.sectionMaxShield.push(100);
    this.sectionShield.push(100);
    return true;
  }
  update(dt, enemies) {
    this.bob += dt * 1.2;
    if (this.shield < this.maxShield) this.shield = Math.min(this.maxShield, this.shield + this.shieldRegen * dt);
    for (let i = 0; i < this.sections; i++) {
      if (this.sectionShield[i] < this.sectionMaxShield[i]) {
        this.sectionShield[i] = Math.min(this.sectionMaxShield[i], this.sectionShield[i] + this.shieldRegen * dt);
      }
    }
    this.syncOverall();
    for (let i = 0; i < this.sections; i++) {
      const w = this.weapons[i];
      if (!w) continue;
      w.update(dt);
      if (w.canFire()) {
        const target = this.findTarget(enemies, w.range, i);
        if (target) {
          const shot = w.fire();
          if (shot) {
            // spawn from the muzzle of the attached base cannon
            const sx = this.x - 155;
            const sy = this.y - (i + 1) * 58 + 29;
            const colors = { 'Machine Gun': '#ffcc44', 'Laser Gun': '#44ddff', 'Plasma Gun': '#cc66ff', 'Railgun': '#ffff66', 'Freeze Cannon': '#66eeff', 'Air Gun': '#88ff66' };
            bullets.push(new Bullet(sx - 8, sy, target.x, target.y - 30, 700, shot.damage, colors[w.type] || '#88ccff', false));
            particles.push(new Particle(sx - 12, sy, colors[w.type] || '#fff', 0.12, 6));
          }
        }
      }
    }
  }
  findTarget(enemies, range, slot = 0) {
    const alive = enemies.filter(e => e.alive && e.x < this.x && Math.abs(e.x - this.x) < range);
    if (!alive.length) return null;
    alive.sort((a, b) => Math.abs(a.x - this.x) - Math.abs(b.x - this.x));
    return alive[slot % alive.length];
  }
  takeDamage(amount) {
    // Damage the lowest living section first
    for (let i = 0; i < this.sections; i++) {
      if (this.sectionHealth[i] <= 0) continue;
      if (this.sectionShield[i] > 0) {
        const abs = Math.min(this.sectionShield[i], amount);
        this.sectionShield[i] -= abs;
        amount -= abs;
      }
      if (amount > 0) {
        this.sectionHealth[i] = Math.max(0, this.sectionHealth[i] - amount);
        amount = 0;
      }
      break;
    }
    // Fortress dies only if every section is destroyed
    this.syncOverall();
    return this.sectionHealth.some(h => h > 0);
  }
  syncOverall() {
    this.health = this.sectionHealth.reduce((a, b) => a + Math.max(0, b), 0);
    this.maxHealth = this.sectionMaxHealth.reduce((a, b) => a + b, 0) || 1;
    this.shield = this.sectionShield.reduce((a, b) => a + Math.max(0, b), 0);
    this.maxShield = this.sectionMaxShield.reduce((a, b) => a + b, 0) || 1;
  }
  resetSections() {
    for (let i = 0; i < this.sections; i++) {
      this.sectionHealth[i] = this.sectionMaxHealth[i];
      this.sectionShield[i] = this.sectionMaxShield[i];
    }
    this.syncOverall();
  }
  draw() {
    const y = this.y + Math.sin(this.bob) * 2;
    const secW = 160;
    const secH = 58;
    for (let i = 0; i < this.sections; i++) {
      const isBase = i === 0;
      const isTop = i === this.sections - 1;
      const key = isBase ? 'sec0' : isTop ? 'sec3' : (i % 2 === 0 ? 'sec2' : 'sec1');
      const img = images[key];
      const bx = this.x - secW / 2;
      const by = y - (i + 1) * secH;

      // Bars first so the tower covers them
      const barW = 7;
      const barH = secH - 6;
      const barY = by + (secH - barH) / 2;
      // blue shield under the left edge of the tower art (sticks out slightly so it is visible behind)
      const leftX = bx + 8;
      // red health under the right edge of the tower art
      const rightX = bx + secW - 22;
      // shield
      ctx.fillStyle = '#1a2030';
      ctx.fillRect(leftX, barY, barW, barH);
      ctx.fillStyle = '#4af';
      const sh = this.sectionMaxShield[i] || 1;
      const shFill = barH * Math.max(0, this.sectionShield[i] / sh);
      ctx.fillRect(leftX, barY + (barH - shFill), barW, shFill);
      // health
      ctx.fillStyle = '#2a1010';
      ctx.fillRect(rightX, barY, barW, barH);
      ctx.fillStyle = '#e44';
      const mh = this.sectionMaxHealth[i] || 1;
      const hpFill = barH * Math.max(0, this.sectionHealth[i] / mh);
      ctx.fillRect(rightX, barY + (barH - hpFill), barW, hpFill);

      // block on top of the bars
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, bx, by, secW, secH);
      }
      const w = this.weapons[i];
      if (w && isBase && images.cannon && images.cannon.complete && images.cannon.naturalWidth > 0) {
        const cannonH = 62;
        const cannonW = images.cannon.naturalWidth * (cannonH / images.cannon.naturalHeight);
        const my = by + secH * 0.52;
        const cannonX = bx - cannonW + 58;
        const cannonY = my - cannonH / 2;
        ctx.drawImage(images.cannon, cannonX, cannonY, cannonW, cannonH);
      }
    }
  }
}

class Hero {
  constructor() {
    this.level = 1; this.damage = 20; this.attackSpeed = 1.5; this.cooldown = 0;
    this.abilities = {
      'Air Strike': { cd: 20, cur: 0, dmg: 150 },
      'EMP Blast': { cd: 25, cur: 0, dmg: 80 },
      'Energy Shield': { cd: 30, cur: 0, effect: 'shield' },
      'Plasma Bomb': { cd: 18, cur: 0, dmg: 200 }
    };
  }
  update(dt, fortress, enemies) {
    this.x = fortress.x - 165; this.y = GROUND_Y;  // stand fully left of the cannon
    if (this.cooldown > 0) this.cooldown -= dt;
    for (const a of Object.values(this.abilities)) if (a.cur > 0) a.cur -= dt;
    if (this.cooldown <= 0) {
      const t = this.findTarget(enemies);
      if (t) { this.cooldown = 1 / this.attackSpeed; bullets.push(new Bullet(this.x - 10, this.y - 40, t.x, t.y - 30, 600, this.damage, '#00ffff', false)); }
    }
  }
  findTarget(enemies) {
    let best = null, d = 280;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dist = Math.abs(e.x - this.x);
      if (dist < d && e.x < this.x) { d = dist; best = e; }
    }
    return best;
  }
  useAbility(name, enemies, fortress) {
    const a = this.abilities[name];
    if (!a || a.cur > 0) return;
    a.cur = a.cd;
    if (name === 'Energy Shield') {
      for (let i = 0; i < fortress.sections; i++) {
        fortress.sectionShield[i] = Math.min(fortress.sectionMaxShield[i], fortress.sectionShield[i] + 80);
      }
      fortress.syncOverall();
    }
    else {
      for (const e of enemies) if (Math.abs(e.x - fortress.x) < 320) e.takeDamage(a.dmg || 100);
      for (let i = 0; i < 25; i++) particles.push(new Particle(fortress.x - 40, GROUND_Y - 40, '#ffaa00', 0.8, 7));
    }
  }
  draw() {
    if (images.hero && images.hero.complete && images.hero.naturalWidth > 0) {
      ctx.drawImage(images.hero, this.x - 35, this.y - 90, 70, 90);
    } else {
      ctx.fillStyle = '#0af';
      ctx.fillRect(this.x - 20, this.y - 70, 40, 70);
      ctx.fillStyle = '#fff';
      ctx.font = '12px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('HERO', this.x, this.y - 30);
    }
  }
}

class Enemy {
  constructor(type, scale = 1) {
    this.type = type;
    this.health = this.maxHealth = this.baseHealth() * scale;
    this.damage = this.baseDamage() * scale;
    this.armor = this.baseArmor();
    this.speed = this.baseSpeed();
    this.rewardCoins = Math.floor(4 * scale * (0.7 + Math.random() * 0.6));
    this.rewardTech = Math.floor(1 * scale);
    this.rewardExp = Math.floor(6 * scale);
    this.x = -40 - Math.random() * 100;
    this.y = GROUND_Y;
    this.alive = true;
    this.bob = Math.random() * Math.PI * 2;
    this.sprite = images[type.toLowerCase()] || images.scout;
  }
  baseHealth() { return { Scout: 50, Warrior: 140, Tank: 500, Flying: 90, Elite: 280, Boss: 2200 }[this.type] || 100; }
  baseArmor() { return { Tank: 100, Elite: 20, Boss: 40 }[this.type] || 0; }
  baseDamage() { return { Scout: 6, Warrior: 16, Tank: 32, Flying: 12, Elite: 28, Boss: 55 }[this.type] || 10; }
  baseSpeed() { return { Scout: 90, Warrior: 60, Tank: 35, Flying: 75, Elite: 55, Boss: 28 }[this.type] || 50; }
  isRanged() { return this.type === 'Flying' || this.type === 'Tank'; }
  isBomber() { return this.type === 'Tank'; }
  update(dt, fortress) {
    this.bob += dt * 5;
    const attackDist = this.isBomber() ? 460 : this.isRanged() ? 260 : (this.type === 'Boss' ? 110 : 85);
    const stopX = fortress.x - attackDist;
    this.attacking = false;
    if (this.x < stopX) {
      this.x += this.speed * dt;
      if (this.x > stopX) this.x = stopX;
    } else {
      this.attacking = true;
      this.attackTimer = (this.attackTimer || 0) + dt;
      const rate = this.isRanged() ? 1.2 : 0.6;
      if (this.attackTimer >= rate) {
        this.attackTimer = 0;
        if (this.isBomber()) {
          bullets.push(new Bullet(this.x + 10, this.y - 40, fortress.x - 30, fortress.y - 60, 180, this.damage, '#ff8800', true, 10));
        } else if (this.isRanged()) {
          bullets.push(new Bullet(this.x + 10, this.y - 50, fortress.x - 20, fortress.y - 80, 280, this.damage, '#ff5533', true));
        } else {
          fortress.takeDamage(this.damage);
          this.clawTime = 0.25;
          particles.push(new Particle(fortress.x - 60, this.y - 40, '#ffaa88', 0.3, 5));
        }
      }
    }
    if (this.clawTime > 0) this.clawTime -= dt;
  }
  takeDamage(amount) {
    const dealt = Math.max(0, amount - this.armor);
    this.health -= dealt;
    if (this.health <= 0) {
      this.alive = false;
      for (let i = 0; i < 15; i++) particles.push(new Particle(this.x, this.y - 30, '#ff6600', 0.6, 6));
      return true;
    }
    return false;
  }
  draw() {
    const size = this.type === 'Boss' ? 120 : this.type === 'Tank' ? 90 : 65;
    const yOff = this.type === 'Flying' ? -40 : 0;
    const bob = Math.sin(this.bob) * 3;
    const validSprite = this.sprite && this.sprite.complete && this.sprite.naturalWidth > 0;
    if (validSprite) {
      ctx.save();
      ctx.translate(this.x, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(this.sprite, -size/2, this.y - size + yOff + bob, size, size);
      ctx.restore();
    } else {
      ctx.fillStyle = this.type === 'Boss' ? '#c33' : this.type === 'Tank' ? '#666' : '#4a4';
      ctx.fillRect(this.x - size/2, this.y - size + yOff + bob, size, size);
      ctx.fillStyle = '#fff';
      ctx.font = '11px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(this.type[0], this.x, this.y - size/2 + yOff + bob);
    }
    // Claw slash when melee attacking
    if (this.clawTime > 0 && !this.isRanged()) {
      const a = this.clawTime / 0.25;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#ffccaa';
      ctx.lineWidth = 3;
      const cx = this.x + size * 0.3, cy = this.y - size * 0.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * 6, cy - 8);
        ctx.lineTo(cx + 18 + i * 6, cy + 10);
        ctx.stroke();
      }
      ctx.restore();
    }
    const bar = size * 0.9;
    ctx.fillStyle = '#300';
    ctx.fillRect(this.x - bar/2, this.y - size - 12 + yOff, bar, 6);
    ctx.fillStyle = '#0c0';
    ctx.fillRect(this.x - bar/2, this.y - size - 12 + yOff, bar * Math.max(0, this.health / this.maxHealth), 6);
  }
}

class EnemySpawner {
  constructor() {
    this.enemies = [];
    this.toSpawn = 0;
    this.timer = 0;
    this.interval = 1.2;
    this.scale = 1;
    this.boss = false;
    this.currentWave = 1;
    this.totalWaves = 8;
  }
  startLevel(level) {
    this.scale = 1 + (level - 1) * 0.2;
    this.currentWave = 1;
    this.totalWaves = 8;
    this.startWave();
  }
  startWave() {
    const lvl = levelMgr.currentLevel;
    const w = this.currentWave;
    this.toSpawn = 5 + Math.floor(lvl * 1.4) + (w - 1) * 3;
    this.interval = Math.max(0.35, 1.6 - lvl * 0.03 - (w - 1) * 0.12);
    this.waveScale = this.scale * (1 + (w - 1) * 0.12);
    this.enemies = [];
    this.boss = false;
    this.timer = 0.4;
    this.tanksSpawned = 0;
    this.maxTanks = 3 + Math.floor((lvl - 1) / 6) + Math.floor((w - 1) / 2);
  }
  update(dt, fortress) {
    this.timer += dt;
    if (this.toSpawn > 0 && this.timer >= this.interval) {
      this.timer = 0;
      const type = this.pickType();
      if (type === 'Tank') this.tanksSpawned++;
      this.enemies.push(new Enemy(type, this.waveScale || this.scale));
      this.toSpawn--;
    }
    for (const e of this.enemies) if (e.alive) e.update(dt, fortress);
    // Boss on the last wave of every 5th level
    if (lvlIsBoss() && this.currentWave === this.totalWaves && !this.boss && this.toSpawn === 0 && this.enemies.filter(e => e.alive).length < 2) {
      this.enemies.push(new Enemy('Boss', this.scale * 1.6));
      this.boss = true;
    }
  }
  pickType() {
    const l = levelMgr.currentLevel, w = this.currentWave, r = Math.random();
    const allowTank = this.tanksSpawned < this.maxTanks;
    if (l < 4) return w < 3 ? (r < 0.7 ? 'Scout' : 'Warrior') : (r < 0.4 ? 'Scout' : 'Warrior');
    if (!allowTank) return r < 0.5 ? 'Scout' : r < 0.8 ? 'Warrior' : 'Flying';
    if (l < 10) return r < 0.35 ? 'Scout' : r < 0.75 ? 'Warrior' : 'Tank';
    if (l < 20) return r < 0.2 ? 'Scout' : r < 0.5 ? 'Warrior' : r < 0.7 ? 'Tank' : r < 0.88 ? 'Flying' : 'Elite';
    return ['Warrior','Tank','Flying','Elite'][Math.floor(Math.random()*4)];
  }
  cleared() { return this.toSpawn <= 0 && this.enemies.every(e => !e.alive); }
}
function lvlIsBoss() { return levelMgr.currentLevel % 5 === 0; }

class Economy { constructor() { this.coins = 500; this.tech = 0; } add(c, t) { this.coins += c; this.tech += t; } }
class UpgradeSystem {
  generate() {
    const pool = [
      { name: '+15% Weapon Damage', type: 'damage', val: 0.15, cost: 80 },
      { name: '+20% Fire Rate', type: 'fire_rate', val: 0.20, cost: 90 },
      { name: '+25% Shield Capacity', type: 'shield', val: 0.25, cost: 80 },
      { name: '+12% Hero Damage', type: 'hero_damage', val: 0.12, cost: 70 },
      { name: '+20% Fortress Health', type: 'health', val: 0.20, cost: 100 },
      { name: '+10% Crit Chance', type: 'crit', val: 0.10, cost: 110 }
    ];
    return pool.sort(() => Math.random() - 0.5).slice(0, 3);
  }
  apply(upg) {
    const v = upg.val;
    if (upg.type === 'damage') fortress.weapons.forEach(w => w && (w.damage *= 1+v));
    else if (upg.type === 'fire_rate') fortress.weapons.forEach(w => w && (w.fireRate *= 1+v));
    else if (upg.type === 'shield') {
      fortress.sectionMaxShield = fortress.sectionMaxShield.map(v => v * (1 + v));
      fortress.sectionShield = fortress.sectionMaxShield.slice();
      fortress.syncOverall();
    }
    else if (upg.type === 'health') {
      fortress.sectionMaxHealth = fortress.sectionMaxHealth.map(v => v * (1 + v));
      fortress.sectionHealth = fortress.sectionMaxHealth.slice();
      fortress.syncOverall();
    }
    else if (upg.type === 'hero_damage') hero.damage *= 1+v;
    else if (upg.type === 'crit') fortress.weapons.forEach(w => w && (w.critChance = Math.min(0.55, w.critChance + v)));
  }
}
class AdSystem {
  constructor() { this.active = false; this.countdown = 0; this.type = null; this.data = null; }
  start(type, data) { this.active = true; this.countdown = 15; this.type = type; this.data = data; }
  update(dt) {
    if (!this.active) return null;
    this.countdown -= dt;
    if (this.countdown <= 0) { this.active = false; return { type: this.type, data: this.data }; }
    return null;
  }
}
class LevelManager {
  constructor() { this.currentLevel = 1; }
  getArea() {
    const areas = [[1,'Rural Earth'],[8,'Desert Outpost'],[15,'Industrial Zone'],[22,'Ruined City'],[30,'Arctic Base'],[38,'Moon Colony'],[45,'Mars Settlement']];
    let name = 'Rural Earth';
    for (const [t, n] of areas) if (this.currentLevel >= t) name = n;
    return name;
  }
  complete() { this.currentLevel++; }
}

class RewardSystem {
  constructor() { this.claimed = []; this.pendingChest = null; }
  nextMilestone(level) { return Math.ceil((level + 0.1) / 5) * 5; }
  waveReward(wave, level) {
    return { kind: 'wave', coins: 15 + wave * 10 + level * 5, tech: 1, label: `Wave ${wave} Chest` };
  }
  milestoneReward(level) {
    return { kind: 'milestone', coins: 50 + level * 15, tech: 4 + Math.floor(level / 2), label: `Level ${level} Milestone` };
  }
  setWaveChest(wave, level) { this.pendingChest = this.waveReward(wave, level); }
  setMilestoneChest(level) { this.pendingChest = this.milestoneReward(level); }
  claim() {
    if (!this.pendingChest) return null;
    const c = this.pendingChest;
    economy.add(c.coins, c.tech);
    if (c.kind === 'milestone') this.claimed.push(c.label);
    this.pendingChest = null;
    return c;
  }
  nextGoal() {
    const lvl = levelMgr.currentLevel;
    const next = this.nextMilestone(lvl);
    const cheapest = WEAPON_SHOP.reduce((a, b) => a.cost < b.cost ? a : b);
    const need = Math.max(0, cheapest.cost - economy.coins);
    const wavesLeft = spawner.totalWaves - spawner.currentWave + 1;
    return {
      goal: wavesLeft <= 1 ? 'Clear this wave for chest + shop' : `Clear wave for chest (${wavesLeft} left)`,
      milestone: `Level ${next} Milestone`,
      progress: (lvl % 5) / 5,
      needCoins: need,
      cheapest: cheapest.type
    };
  }
}

function init() {
  fortress = new Fortress();
  hero = new Hero();
  spawner = new EnemySpawner();
  economy = new Economy();
  upgrades = new UpgradeSystem();
  adSystem = new AdSystem();
  levelMgr = new LevelManager();
  rewards = new RewardSystem();
  load();
}
function load() {
  const s = localStorage.getItem('finalFortress');
  if (s) {
    const d = JSON.parse(s);
    economy.coins = d.coins || 0; economy.tech = d.tech || 0;
    levelMgr.currentLevel = d.level || 1; hero.level = d.heroLevel || 1;
    if (d.claimed) rewards.claimed = d.claimed;
  }
}
function save() {
  localStorage.setItem('finalFortress', JSON.stringify({
    coins: economy.coins, tech: economy.tech, level: levelMgr.currentLevel, heroLevel: hero.level,
    claimed: rewards.claimed
  }));
}
function openShop() {
  lost = false;
  state = 'upgrade';
  pendingChoices = upgrades.generate();
  save();
}
function startLevel() {
  lost = false;
  levelStarted = true;
  state = 'playing';
    spawner.startLevel(levelMgr.currentLevel);
  fortress.resetSections();
  particles = [];
  bullets = [];
}
function nextWave() {
  lost = false;
  spawner.currentWave++;
  spawner.startWave();
  state = 'playing';
  fortress.resetSections();
  particles = [];
  bullets = [];
}
function retryWave() {
  lost = false;
  spawner.startWave();
  state = 'playing';
  fortress.resetSections();
  particles = [];
  bullets = [];
}
function waveCleared() {
  lost = false;
  rewards.setWaveChest(spawner.currentWave, levelMgr.currentLevel);
  pendingChoices = upgrades.generate();
  state = 'upgrade';
  save();
}
function levelComplete() {
  lost = false;
  levelStarted = false;
  economy.coins = 500;
  const finished = levelMgr.currentLevel;
  levelMgr.complete();
    if (finished % 5 === 0) rewards.setMilestoneChest(finished);
  else rewards.setWaveChest(spawner.currentWave, finished);
  pendingChoices = upgrades.generate();
  state = 'upgrade';
  save();
}
function applyChoice(upg) {
  if (upg.cost && economy.coins < upg.cost) return;
  if (upg.cost) economy.coins -= upg.cost;
  upgrades.apply(upg);
  save();
  // stay on shop so player can buy more or continue
}
function buyWeaponForSlot(type, slot) {
  if (fortress.buyWeapon(type, slot)) {
    save();
    // stay on shop so player can buy more or continue
  }
}
function update(dt) {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => p.update(dt));
  bullets = bullets.filter(b => b.alive);
  bullets.forEach(b => b.update(dt, spawner ? spawner.enemies : []));
  if (state === 'playing') {
    spawner.update(dt, fortress);
    fortress.update(dt, spawner.enemies);
    hero.update(dt, fortress, spawner.enemies);
    for (const e of spawner.enemies) {
      if (!e.alive && !e.rewarded) {
        economy.add(Math.floor(e.rewardCoins * fortress.coinMult), e.rewardTech);
        e.rewarded = true;
      }
    }
    if (spawner.cleared() && fortress.health > 0) {
      if (spawner.currentWave < spawner.totalWaves) waveCleared();
      else levelComplete();
    }
    if (fortress.health <= 0) {
      lost = true;
      pendingChoices = upgrades.generate();
      state = 'upgrade';
      save();
    }
  } else if (state === 'ad') {
    const r = adSystem.update(dt);
    if (r) {
      if (r.type === 'both') r.data.forEach(u => upgrades.apply(u));
      else if (r.type === 'double') economy.coins *= 2;
      startLevel();
    }
  }
}
function draw() {
  if (images.background) ctx.drawImage(images.background, 0, 0, WIDTH, HEIGHT);
  else { ctx.fillStyle = '#0c1220'; ctx.fillRect(0, 0, WIDTH, HEIGHT); }
  // ground line
  ctx.strokeStyle = '#3a4a5a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(WIDTH, GROUND_Y);
  ctx.stroke();

  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 54px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('FINAL FORTRESS', WIDTH/2, 190);
    ctx.font = '28px Segoe UI';
    ctx.fillStyle = '#4af';
    ctx.fillText('Earth Defense', WIDTH/2, 240);
    ctx.fillStyle = '#2a8';
    ctx.fillRect(WIDTH/2 - 140, 320, 280, 75);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 38px Segoe UI';
    ctx.fillText('PLAY', WIDTH/2, 368);
  } else if (state === 'playing') {
    fortress.draw();
    hero.draw();
    for (const e of spawner.enemies) if (e.alive) e.draw();
    bullets.forEach(b => b.draw());
    particles.forEach(p => p.draw());
    ctx.fillStyle = 'rgba(8,12,20,0.8)';
    ctx.fillRect(0, 0, WIDTH, 60);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Segoe UI';
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${levelMgr.currentLevel}  •  Wave ${spawner.currentWave}/${spawner.totalWaves}  •  ${levelMgr.getArea()}`, 18, 38);
    ctx.fillStyle = '#fd0';
    ctx.fillText(`Coins ${economy.coins}`, 520, 38);
    ctx.fillStyle = '#4df';
    ctx.fillText(`Tech ${economy.tech}`, 600, 38);
    ctx.fillText(`Hero Lv.${hero.level}`, 800, 38);
    // Next goal panel
    const ng = rewards.nextGoal();
    ctx.fillStyle = 'rgba(8,12,20,0.75)';
    ctx.beginPath(); ctx.roundRect(16, 68, 340, 68, 8); ctx.fill();
    ctx.fillStyle = '#fd0'; ctx.font = 'bold 13px Segoe UI'; ctx.textAlign = 'left';
    ctx.fillText(ng.goal, 26, 88);
    ctx.fillStyle = '#8cf'; ctx.font = '12px Segoe UI';
    ctx.fillText(`Next: ${ng.milestone}`, 26, 106);
    // progress bar
    const barX = 26, barY = 112, barW = 200, barH = 6;
    ctx.fillStyle = '#222'; ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#4cf'; ctx.fillRect(barX, barY, barW * ng.progress, barH);
    if (ng.needCoins > 0) {
      ctx.fillStyle = '#fa4'; ctx.font = '11px Segoe UI';
      ctx.fillText(`${ng.needCoins} coins to ${ng.cheapest}`, 26, 128);
    } else {
      ctx.fillStyle = '#4f4'; ctx.font = '11px Segoe UI';
      ctx.fillText(`Can afford ${ng.cheapest}!`, 26, 128);
    }
    let y = HEIGHT - 68;
    buttons = [];
    const abilityIcons = {
      'Air Strike': images.ability_airstrike,
      'EMP Blast': images.ability_emp,
      'Energy Shield': images.ability_shield,
      'Plasma Bomb': images.ability_plasma
    };
    const iconSize = 46;
    const spacing = 58;
    const startX = WIDTH/2 - (Object.keys(hero.abilities).length * spacing) / 2;
    let idx = 0;
    for (const [name, a] of Object.entries(hero.abilities)) {
      const x = startX + idx * spacing;
      const rect = { x: x, y: y, w: iconSize, h: iconSize };
      const icon = abilityIcons[name];
      const validIcon = icon && icon.complete && icon.naturalWidth > 0;
      // Dark rounded background so icons stand out on the wall
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.roundRect(rect.x - 3, rect.y - 3, iconSize + 6, iconSize + 6, 8);
      ctx.fill();
      ctx.globalAlpha = a.cur <= 0 ? 1 : 0.4;
      if (validIcon) {
        ctx.drawImage(icon, rect.x, rect.y, iconSize, iconSize);
      } else {
        ctx.fillStyle = a.cur <= 0 ? '#2a8' : '#555';
        ctx.beginPath();
        ctx.roundRect(rect.x, rect.y, iconSize, iconSize, 8);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(name.split(' ')[0], rect.x + iconSize/2, rect.y + iconSize/2 + 4);
      }
      ctx.globalAlpha = 1;
      // Short label under the icon
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(name.split(' ')[0], rect.x + iconSize/2, rect.y + iconSize + 12);
      if (a.cur > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = 'bold 16px Segoe UI';
        ctx.fillText(Math.ceil(a.cur), rect.x + iconSize/2, rect.y + iconSize/2 + 6);
      }
      buttons.push({ rect, data: { type: 'ability', name } });
      idx++;
    }
    const adR = { x: 14, y: HEIGHT - 48, w: 160, h: 34 };
    ctx.fillStyle = '#f80';
    ctx.fillRect(adR.x, adR.y, adR.w, adR.h);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 13px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('Ad Bonus', adR.x + adR.w/2, adR.y + 22);
    ctx.textAlign = 'left';
    buttons.push({ rect: adR, data: { type: 'ad_double' } });
  } else if (state === 'upgrade') {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    buttons = [];
    const isLevelDone = spawner.currentWave >= spawner.totalWaves;
    const title = lost ? 'Fortress Destroyed!' : isLevelDone ? `Level ${levelMgr.currentLevel - 1} Complete!` : `Wave ${spawner.currentWave} Cleared!`;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText(title, WIDTH/2, 36);
    ctx.fillStyle = '#fd0'; ctx.font = 'bold 20px Segoe UI';
    ctx.fillText(`${economy.coins} coins`, WIDTH/2, 62);

    if (rewards.pendingChest) {
      const chest = rewards.pendingChest;
      const chR = { x: WIDTH/2 - 160, y: 72, w: 320, h: 36 };
      ctx.fillStyle = 'rgba(120,80,20,0.95)';
      ctx.beginPath(); ctx.roundRect(chR.x, chR.y, chR.w, chR.h, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '14px Segoe UI';
      ctx.fillText(`Claim ${chest.label}: +${chest.coins} coins`, WIDTH/2, 95);
      buttons.push({ rect: chR, data: { type: 'claim_chest' } });
    }

    const skillIcons = {
      damage: images.icon_damage, fire_rate: images.icon_firerate, shield: images.icon_shield,
      hero_damage: images.icon_hero, health: images.icon_health, crit: images.icon_crit
    };
    const weaponIcons = {
      'Machine Gun': images.icon_machinegun, 'Laser Gun': images.icon_laser, 'Plasma Gun': images.icon_plasma,
      'Railgun': images.icon_railgun, 'Freeze Cannon': images.icon_freeze, 'Air Gun': images.icon_airgun
    };
    const drawIcon = (img, x, y, s) => { if (img && img.complete && img.naturalWidth > 0) ctx.drawImage(img, x, y, s, s); };
    if (!pendingChoices.length) pendingChoices = upgrades.generate();

    const card = (rect, can, icon, title, sub, data, hot) => {
      ctx.fillStyle = can ? (hot ? 'rgba(30,90,160,0.95)' : 'rgba(40,50,70,0.95)') : 'rgba(30,30,30,0.85)';
      ctx.beginPath(); ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 8); ctx.fill();
      ctx.strokeStyle = can ? '#8cf' : '#555'; ctx.stroke();
      drawIcon(icon, rect.x + 4, rect.y + 6, 36);
      ctx.fillStyle = '#fff'; ctx.font = '12px Segoe UI'; ctx.textAlign = 'left';
      ctx.fillText(title, rect.x + 46, rect.y + 20);
      ctx.fillStyle = '#fd0'; ctx.fillText(sub, rect.x + 46, rect.y + 36);
      buttons.push({ rect, data });
    };

    const secW = 150, secH = 70, cardW = 168, cardH = 52;
    const floorY = HEIGHT - 12;
    const cx = WIDTH / 2;
    const nextGun = WEAPON_SHOP.find(w => !fortress.weapons.some(owned => owned && owned.type === w.type)) || WEAPON_SHOP[0];
    const rowCount = fortress.sections + (fortress.sections < MAX_BLOCKS ? 1 : 0);

    for (let i = 0; i < rowCount; i++) {
      const by = floorY - (i + 1) * secH;
      const owned = i < fortress.sections;
      const key = i === 0 ? 'sec0' : (i === rowCount - 1 ? 'sec3' : (i % 2 ? 'sec1' : 'sec2'));
      const img = images[key] || images.fortress;
      const bx = cx - secW / 2;
      if (img && img.complete) {
        ctx.save();
        if (!owned) ctx.globalAlpha = 0.5;
        ctx.drawImage(img, bx, by, secW, secH);
        ctx.restore();
      }
      if (!owned) {
        const secCost = fortress.sectionCost();
        const can = economy.coins >= secCost;
        const buy = { x: bx + secW + 16, y: by + 10, w: 130, h: 50 };
        ctx.fillStyle = can ? '#2a8' : '#444';
        ctx.beginPath(); ctx.roundRect(buy.x, buy.y, buy.w, buy.h, 10); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Segoe UI'; ctx.textAlign = 'center';
        ctx.fillText('Buy', buy.x + buy.w / 2, buy.y + 22);
        ctx.font = '13px Segoe UI'; ctx.fillStyle = '#fd0';
        ctx.fillText(`${secCost} coins`, buy.x + buy.w / 2, buy.y + 40);
        buttons.push({ rect: buy, data: { type: 'buy_section' } });
      } else {
        const left = pendingChoices[i % pendingChoices.length];
        if (left) {
          card(
            { x: bx - cardW - 12, y: by + 8, w: cardW, h: cardH },
            economy.coins >= left.cost,
            skillIcons[left.type] || images.icon_health,
            left.name, `${left.cost} coins`, left, false
          );
        }
        const wpn = fortress.weapons[i];
        if (!wpn && nextGun) {
          card(
            { x: bx + secW + 12, y: by + 8, w: cardW, h: cardH },
            economy.coins >= nextGun.cost,
            weaponIcons[nextGun.type] || images.icon_machinegun,
            nextGun.type, `${nextGun.cost} coins`,
            { type: 'buy_weapon', weapon: nextGun.type, slot: i }, true
          );
        } else {
          const right = pendingChoices[(i + 1) % pendingChoices.length];
          if (right) {
            card(
              { x: bx + secW + 12, y: by + 8, w: cardW, h: cardH },
              economy.coins >= right.cost,
              skillIcons[right.type] || images.icon_damage,
              right.name, `${right.cost} coins`, right, true
            );
          }
        }
      }
    }

    const contR = { x: WIDTH - 190, y: 18, w: 160, h: 40 };
    ctx.fillStyle = '#2a8';
    ctx.beginPath(); ctx.roundRect(contR.x, contR.y, contR.w, contR.h, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText(lost ? 'Retry' : isLevelDone ? 'Next Level' : 'Next Wave', contR.x + contR.w/2, contR.y + 26);
    buttons.push({ rect: contR, data: { type: 'continue' } });
  } else if (state === 'ad') {
    ctx.fillStyle = '#1a2230';
    ctx.fillRect(WIDTH/2 - 220, HEIGHT/2 - 95, 440, 190);
    ctx.strokeStyle = '#f80';
    ctx.lineWidth = 3;
    ctx.strokeRect(WIDTH/2 - 220, HEIGHT/2 - 95, 440, 190);
    ctx.fillStyle = '#fff';
    ctx.font = '34px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('Simulated Ad', WIDTH/2, HEIGHT/2 - 20);
    ctx.font = '24px Segoe UI';
    ctx.fillStyle = '#fd0';
    ctx.fillText(`Reward in ${Math.ceil(adSystem.countdown)}s`, WIDTH/2, HEIGHT/2 + 35);
  }
}
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (WIDTH / rect.width);
  const y = (e.clientY - rect.top) * (HEIGHT / rect.height);
  if (state === 'menu') {
    if (x > WIDTH/2 - 140 && x < WIDTH/2 + 140 && y > 320 && y < 395) { economy.coins = 500; openShop(); }
  } else if (state === 'upgrade' || state === 'playing') {
    for (const b of buttons) {
      if (x >= b.rect.x && x <= b.rect.x + b.rect.w && y >= b.rect.y && y <= b.rect.y + b.rect.h) {
        if (b.data.type === 'ability') hero.useAbility(b.data.name, spawner.enemies, fortress);
        else if (b.data.type === 'ad_double') { adSystem.start('double'); state = 'ad'; }
        else if (b.data.type === 'buy_weapon') { buyWeaponForSlot(b.data.weapon, b.data.slot); }
        else if (b.data.type === 'buy_section') { fortress.buySection(); save(); }
        else if (b.data.type === 'claim_chest') { rewards.claim(); save(); }
        else if (b.data.type === 'continue') {
          if (!levelStarted) startLevel();
          else if (lost) retryWave();
          else if (spawner.currentWave < spawner.totalWaves) nextWave();
          else startLevel();
        }
        else applyChoice(b.data);
        break;
      }
    }
  }
});
requestAnimationFrame(loop);
</script>
